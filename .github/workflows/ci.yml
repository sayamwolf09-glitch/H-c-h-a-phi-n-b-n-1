name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chemplay?schema=public
      AUTH_SECRET: ci-secret-not-for-prod
      NEXTAUTH_URL: http://localhost:3000
      S3_REGION: auto
      S3_BUCKET: chemplay-media
      S3_ENDPOINT: https://example.r2.cloudflarestorage.com
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chemplay
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight env check
        run: npm run preflight

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma migrate
        run: npm run prisma:migrate -- --name ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
