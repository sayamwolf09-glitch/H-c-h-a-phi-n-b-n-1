version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: chemplay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chemplay
    ports:
      - "5432:5432"
    volumes:
      - chemplay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chemplay_pg_data:
